<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Agent Access Gateway 管理</title>
  <style>
    :root { color-scheme:light; font-family:"Avenir Next","Segoe UI",ui-sans-serif,system-ui,sans-serif; background:#f3f6fb; color:#17233c; --ink:#17233c; --muted:#60708f; --line:#d9e1ee; --blue:#1769e0; --blue-dark:#0d4fac; --blue-soft:#eaf2ff; --green:#137a55; --green-soft:#ecfbf4; --danger:#b42318 }
    * { box-sizing:border-box } body { margin:0; min-height:100vh; background:linear-gradient(180deg,#eaf1fb 0,#f6f8fc 230px,#f3f6fb 100%) }
    main { width:min(1040px,calc(100% - 32px)); margin:48px auto }
    header { position:relative; display:flex; justify-content:space-between; align-items:end; gap:24px; margin-bottom:28px; padding:0 0 22px 20px; border-bottom:1px solid #cdd8e8 }
    header::before { content:""; position:absolute; left:0; top:3px; bottom:22px; width:5px; border-radius:6px; background:var(--blue) }
    h1 { margin:0 0 8px; color:var(--ink); font-size:clamp(28px,4vw,44px); line-height:1.08; letter-spacing:-.035em } h2 { margin:0 0 14px; color:var(--ink); font-size:20px } p { margin:0; color:var(--muted); line-height:1.55 }
    .card { background:#fff; border:1px solid var(--line); border-radius:14px; padding:24px; box-shadow:0 10px 32px rgba(33,55,92,.08) }
    .grid { display:grid; grid-template-columns:1fr 1fr; gap:18px } .wide { grid-column:1/-1 }
    label { display:grid; gap:8px; color:#344460; font-size:14px; font-weight:650 }
    input { width:100%; padding:12px 14px; border:1px solid #bac6d8; border-radius:9px; color:var(--ink); background:#fff; outline:none; font:inherit }
    input::placeholder { color:#8a98af } input:hover { border-color:#94a6c0 } input:focus { border-color:var(--blue); box-shadow:0 0 0 3px rgba(23,105,224,.16) }
    button { border:1px solid var(--blue); border-radius:9px; padding:11px 16px; font:inherit; font-weight:700; cursor:pointer; color:#fff; background:var(--blue); box-shadow:0 2px 5px rgba(23,105,224,.18); transition:background .15s,border-color .15s,transform .15s }
    button:hover { background:var(--blue-dark); border-color:var(--blue-dark) } button:active { transform:translateY(1px) } button:focus-visible { outline:3px solid rgba(23,105,224,.22); outline-offset:2px }
    button.secondary { color:#263a5d; background:#fff; border-color:#b9c6d9; box-shadow:0 1px 3px rgba(20,39,72,.08) } button.secondary:hover { color:var(--blue-dark); background:var(--blue-soft); border-color:#8eb6ef } button:disabled { opacity:.5; cursor:wait }
    .actions { display:flex; gap:12px; align-items:center }.status { min-height:22px; color:var(--danger); font-weight:600 }
    .result { display:none; margin-top:18px; padding:17px; border:1px solid #9ed8c1; border-radius:11px; color:#175b43; background:var(--green-soft) }
    code { display:block; margin:10px 0; padding:12px; border:1px solid #bce3d2; border-radius:8px; background:#fff; overflow-wrap:anywhere; color:#075a3d; font-family:"SFMono-Regular",Consolas,monospace; font-size:13px }
    #users { overflow-x:auto } table { width:100%; min-width:680px; border-collapse:collapse; margin-top:8px } th,td { text-align:left; padding:13px 11px; border-bottom:1px solid #e1e7f0; color:#344460; font-size:14px } th { color:#5d6d88; background:#f6f8fb; font-size:12px; letter-spacing:.035em; text-transform:uppercase } tbody tr:hover { background:#f8faff } tbody tr:last-child td { border-bottom:0 }
    @media(max-width:700px){header{align-items:start;flex-direction:column}.grid{grid-template-columns:1fr}.wide{grid-column:auto}}
  </style>
</head>
<body><main>
  <header><div><h1>Gateway 用户密钥</h1><p>一个用户可以拥有多个 API Key，每个 Key 独立拥有一个 Browser 和一个 Google User。明文 Key 只展示一次。</p></div><div class="actions"><button class="secondary" type="button" onclick="location.href='/admin/test'">API 测试台</button><button class="secondary" id="refresh">刷新用户列表</button></div></header>
  <section class="card">
    <form id="form" class="grid">
      <label class="wide">Admin API Key<input id="adminKey" type="password" autocomplete="off" required placeholder="admin.apiKey"></label>
      <label>User ID<input id="userId" required placeholder="例如 user-123"></label>
      <label>用户名称<input id="name" placeholder="可选"></label>
      <div class="wide actions"><button id="submit" type="submit">新增 Gateway API Key</button><span class="status" id="status"></span></div>
    </form>
    <div class="result" id="result"><strong>请立即复制并安全分发，刷新页面后无法再次读取：</strong><code id="apiKey"></code><button class="secondary" id="copy">复制 API Key</button></div>
  </section>
  <section class="card" style="margin-top:20px"><h2>Gateway 用户</h2><div id="users"><p>输入 Admin API Key 后点击刷新。</p></div></section>
  <section class="card" style="margin-top:20px">
    <h2>Google 账号池</h2><p style="margin-bottom:18px">批量创建 Workspace 用户并加入可分配账号池。单批最多 100 个。</p>
    <form id="batchForm" class="grid">
      <label>创建数量<input id="batchCount" type="number" min="1" max="100" value="5" required></label>
      <label>Workspace Domain<input id="batchDomain" value="vertr.ai" required></label>
      <div class="wide actions"><button id="batchSubmit" type="submit">批量生产 Google 账号</button><span class="status" id="batchStatus"></span></div>
    </form>
    <div class="result" id="batchResult"><strong id="batchSummary"></strong><code id="batchOutput"></code><button class="secondary" id="copyBatch">复制创建结果</button></div>
    <div id="googleAccounts" style="margin-top:18px"><p>输入 Admin API Key 后点击刷新。</p></div>
  </section>
</main><script>
const $=id=>document.getElementById(id); const adminKey=$('adminKey'); adminKey.value=sessionStorage.getItem('gatewayAdminKey')||'';
function headers(){const key=adminKey.value.trim();sessionStorage.setItem('gatewayAdminKey',key);return {'Authorization':'Bearer '+key,'Content-Type':'application/json'}}
async function request(path,options={}){const response=await fetch(path,{...options,headers:{...headers(),...(options.headers||{})}});const data=await response.json().catch(()=>({}));if(!response.ok)throw new Error(data.error||('HTTP '+response.status));return data}
$('form').addEventListener('submit',async event=>{event.preventDefault();$('submit').disabled=true;$('status').textContent='';$('result').style.display='none';try{const data=await request('/v1/admin/users',{method:'POST',body:JSON.stringify({userId:$('userId').value.trim(),name:$('name').value.trim()})});$('apiKey').textContent=data.gatewayApiKey;$('result').style.display='block';await loadUsers()}catch(error){$('status').textContent=error.message}finally{$('submit').disabled=false}})
$('copy').onclick=async()=>{await navigator.clipboard.writeText($('apiKey').textContent);$('copy').textContent='已复制';setTimeout(()=>$('copy').textContent='复制 API Key',1200)};
$('refresh').onclick=loadAll;
async function loadUsers(){try{const data=await request('/v1/admin/users');const rows=data.items.flatMap(u=>(u.accessKeys||[]).map(k=>`<tr><td>${escapeHTML(u.id)}</td><td>${escapeHTML(u.name)}</td><td>${escapeHTML(k.id)}</td><td>${escapeHTML(k.keyPrefix||'-')}</td><td>${escapeHTML(k.status)}</td><td>${escapeHTML(k.googleEmail||'-')}</td><td>${escapeHTML(k.browserId||'-')}</td></tr>`)).join('');$('users').innerHTML=`<table><thead><tr><th>User ID</th><th>名称</th><th>Access Key ID</th><th>Key 前缀</th><th>状态</th><th>Google User</th><th>Browser</th></tr></thead><tbody>${rows||'<tr><td colspan="7">暂无 API Key</td></tr>'}</tbody></table>`}catch(error){$('users').innerHTML=`<p style="color:#b42318">${escapeHTML(error.message)}</p>`}}
async function loadGoogleAccounts(){try{const data=await request('/v1/admin/google/accounts');const rows=data.items.map(a=>`<tr><td>${escapeHTML(a.email)}</td><td>${escapeHTML(a.status)}</td><td>${escapeHTML(a.assignedAccessKeyId||'-')}</td><td>${escapeHTML(a.googleUserId||'-')}</td></tr>`).join('');const available=data.items.filter(a=>a.status==='available').length;$('googleAccounts').innerHTML=`<p style="margin-bottom:8px">共 ${data.items.length} 个账号，当前可分配 ${available} 个。</p><table><thead><tr><th>Email</th><th>状态</th><th>绑定 Access Key</th><th>Google User ID</th></tr></thead><tbody>${rows||'<tr><td colspan="4">账号池为空</td></tr>'}</tbody></table>`}catch(error){$('googleAccounts').innerHTML=`<p style="color:#b42318">${escapeHTML(error.message)}</p>`}}
async function loadAll(){await Promise.all([loadUsers(),loadGoogleAccounts()])}
$('batchForm').addEventListener('submit',async event=>{event.preventDefault();if(!confirm(`确认创建 ${$('batchCount').value} 个真实 Google Workspace 账号？`))return;$('batchSubmit').disabled=true;$('batchStatus').textContent='创建过程中请勿关闭页面…';$('batchResult').style.display='none';try{const data=await request('/v1/admin/google/accounts/batch',{method:'POST',body:JSON.stringify({count:Number($('batchCount').value),domain:$('batchDomain').value.trim()})});$('batchSummary').textContent=`已创建 ${data.createdCount} / ${data.requestedCount} 个账号`;$('batchOutput').textContent=JSON.stringify(data.created,null,2);$('batchResult').style.display='block';$('batchStatus').textContent='';await loadGoogleAccounts()}catch(error){$('batchStatus').textContent=error.message;await loadGoogleAccounts()}finally{$('batchSubmit').disabled=false}})
$('copyBatch').onclick=async()=>{await navigator.clipboard.writeText($('batchOutput').textContent);$('copyBatch').textContent='已复制';setTimeout(()=>$('copyBatch').textContent='复制创建结果',1200)};
function escapeHTML(value){return String(value).replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))}
</script></body></html>
