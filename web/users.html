<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>用户与密钥</title><link rel="stylesheet" href="/admin/assets/common.css"></head><body><div class="shell">
<aside class="side"><div class="brand"><span>AGENT INFRASTRUCTURE</span><b>Access Gateway</b></div><nav class="nav"><a href="/admin">资源总览</a><a class="active" href="/admin/users">用户与密钥</a><a href="/admin/google">Google 资源</a><a href="/admin/telegram">Telegram 资源</a><div class="divider"></div><a href="/admin/test">API 测试台</a></nav></aside>
<main class="content"><header class="page-head"><div><div class="eyebrow">Identity & allocation</div><h1>用户与密钥</h1><p>一个用户可拥有多个 API Key，每个 Key 独立绑定资源。</p></div><label class="admin-key">Admin API Key<input id="adminKey" type="password"></label></header>
<section class="grid"><article class="card"><h2>新增 Gateway API Key</h2><form id="form" class="grid"><label>User ID<input id="userId" required placeholder="user-123"></label><label>用户名称<input id="name" placeholder="可选"></label><div class="wide actions"><button type="submit" id="create">创建并显示 Key</button><span id="status" class="status"></span></div></form><pre id="result" class="result"></pre></article><article class="card"><h2>安全提示</h2><p>明文 API Key 只在创建时展示一次。复制后通过安全渠道交给 Agent 使用者。</p></article><article class="card wide"><div class="page-head"><div><h2>用户资源绑定</h2><p>查看每个 API Key 当前拥有的 Google、Browser 与 Telegram 资源。</p></div><button id="refresh" class="secondary">刷新列表</button></div><div id="users" class="table-wrap"><div class="empty">输入 Admin API Key 后刷新。</div></div></article></section>
</main></div><script src="/admin/assets/common.js"></script><script>
async function load(){try{const d=await adminRequest('/v1/admin/users');const rows=d.items.flatMap(u=>(u.accessKeys||[]).map(k=>`<tr><td>${esc(u.id)}</td><td>${esc(k.keyPrefix)}</td><td>${pill(k.status)}</td><td>${esc(k.googleEmail||'—')}</td><td>${esc(k.browserId||'—')}</td><td>${esc(k.telegramBot||'—')}</td></tr>`)).join('');$('users').innerHTML=`<table><thead><tr><th>用户</th><th>Key 前缀</th><th>状态</th><th>Google</th><th>Browser</th><th>Telegram</th></tr></thead><tbody>${rows||'<tr><td colspan="6" class="empty">还没有 API Key</td></tr>'}</tbody></table>`}catch(e){$('users').innerHTML=`<div class="empty error">${esc(e.message)}</div>`}}$('refresh').onclick=load;$('form').onsubmit=async e=>{e.preventDefault();setBusy($('create'),true);try{const d=await adminRequest('/v1/admin/users',{method:'POST',body:JSON.stringify({userId:$('userId').value.trim(),name:$('name').value.trim()})});$('result').textContent=d.gatewayApiKey;$('result').style.display='block';showStatus($('status'),'Key 已创建，请立即复制',true);load()}catch(x){showStatus($('status'),x.message)}finally{setBusy($('create'),false)}};
</script></body></html>
