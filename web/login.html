<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>管理员登录 · Agent Runtime Hub</title><link rel="stylesheet" href="/admin/assets/common.css"><style>
body{min-height:100vh;display:grid;place-items:center;padding:24px;background:radial-gradient(circle at 20% 10%,#e5f8fb 0,transparent 38%),var(--canvas)}.login-card{width:min(440px,100%);padding:38px}.login-mark{display:grid;place-items:center;width:48px;height:48px;margin-bottom:24px;border-radius:14px;background:var(--ink);color:#fff;font:800 20px ui-monospace,monospace}.login-card h1{font-size:34px}.login-card .button{width:100%;margin-top:28px;padding:13px}.login-error{display:none;margin-top:18px}.login-error.visible{display:block}
</style></head><body><main class="card login-card"><div class="login-mark">AR</div><div class="eyebrow">Agent Runtime Control</div><h1>管理员登录</h1><p>使用已加入管理员白名单的 Google 账号继续。</p><a class="button" href="/auth/google/login"><span>使用 Google 账号登录</span></a><div id="error" class="notice login-error"></div></main><script>
const messages={not_allowed:"此 Google 账号不在管理员白名单中。",invalid_state:"登录状态已失效，请重新登录。",oauth_failed:"Google 登录验证失败，请重试。",not_configured:"管理员 Google 登录尚未配置。"};const code=new URLSearchParams(location.search).get("error");if(code){const node=document.getElementById("error");node.textContent=messages[code]||"登录失败，请重试。";node.classList.add("visible")}
</script></body></html>
