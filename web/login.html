<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>管理员登录 · Agent Runtime Hub</title><link rel="stylesheet" href="/admin/assets/common.css"><script src="https://accounts.google.com/gsi/client" async defer></script><style>
body{min-height:100vh;display:grid;place-items:center;padding:24px;background:radial-gradient(circle at 20% 10%,#e5f8fb 0,transparent 38%),var(--canvas)}.login-card{width:min(440px,100%);padding:38px}.login-mark{display:grid;place-items:center;width:48px;height:48px;margin-bottom:24px;border-radius:14px;background:var(--ink);color:#fff;font:800 20px ui-monospace,monospace}.login-card h1{font-size:34px}.google-button{display:flex;justify-content:center;margin-top:28px;min-height:44px}.login-error{display:none;margin-top:18px}.login-error.visible{display:block}
</style></head><body><main class="card login-card"><div class="login-mark">AR</div><div class="eyebrow">Agent Runtime Control</div><h1>管理员登录</h1><p>使用已加入管理员白名单的 Google 账号继续。</p><div id="googleButton" class="google-button"></div><div id="error" class="notice login-error"></div></main><script>
const errorNode=document.getElementById("error");function showError(message){errorNode.textContent=message;errorNode.classList.add("visible")}async function postGoogleCredential(response){errorNode.classList.remove("visible");try{const result=await fetch("/v1/admin/auth/google",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({id_token:response.credential})});const data=await result.json().catch(()=>({}));if(!result.ok)throw new Error(result.status===403?"此 Google 账号不在管理员白名单中。":data.error||"Google 登录验证失败，请重试。");location.assign(data.redirect||"/admin")}catch(error){showError(error.message)}}async function renderGoogleButton(retry=0){try{const info=await fetch("/v1/admin/auth/info").then(response=>response.json());if(!info.googleClientId){showError("管理员 Google 登录尚未配置。");return}if(!window.google?.accounts?.id){if(retry>80){showError("Google 登录组件加载失败，请刷新重试。");return}setTimeout(()=>renderGoogleButton(retry+1),100);return}google.accounts.id.initialize({client_id:info.googleClientId,callback:postGoogleCredential});google.accounts.id.renderButton(document.getElementById("googleButton"),{theme:"outline",size:"large",text:"signin_with",shape:"rectangular"})}catch(error){showError("无法读取登录配置，请稍后重试。")}}renderGoogleButton();
</script></body></html>
